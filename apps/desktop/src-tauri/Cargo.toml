[package]
name = "ai-clip-memory-desktop"
version = "0.3.1"
license = "MIT"
description = "Slate local-first desktop capture application"
authors = ["Slate contributors"]
edition = "2021"
default-run = "ai-clip-memory-desktop"

[features]
ux-dev = []
macos-dev = []

[[bin]]
name = "ai-clip-memory-native-host"
path = "src/bin/ai-clip-memory-native-host.rs"

[lib]
name = "ai_clip_memory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "=2.7.2", features = [] }
tauri-codegen = "=2.7.2"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures-util = "=0.3.34"
semver = "=1.0.28"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["native-tls", "zip", "system-proxy"] }
url = "2"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
winreg = "0.55"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }
