[package]
name = "ai-clip-memory-desktop"
version = "0.0.0"
description = "Local-first AI clip memory desktop application"
authors = ["AI Clip Memory contributors"]
edition = "2021"

[lib]
name = "ai_clip_memory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tauri = { version = "2", features = [] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
