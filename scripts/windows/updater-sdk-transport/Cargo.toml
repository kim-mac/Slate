[package]
name = "slate-sdk-transport-test"
version = "0.0.0"
edition = "2021"
publish = false

# Independent test tool. Not a desktop dependency or installer target.
[dependencies]
tauri = { version = "=2.12.3", default-features = false, features = ["test"] }
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["native-tls", "zip", "system-proxy"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls"] }
futures-util = "=0.3.34"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
url = "=2.5.8"
